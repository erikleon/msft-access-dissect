[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "access-dissect"
version = "0.1.0"
description = "Reverse-engineer, document, and modernize Microsoft Access applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["microsoft-access", "migration", "reverse-engineering", "documentation"]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "pywin32>=306",
    "pyodbc>=5.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "networkx>=3.0",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "syrupy>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-pywin32",
]

[project.scripts]
access-dissect = "access_dissect.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/access_dissect"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_access: marks tests that need Microsoft Access installed (deselect with '-m not requires_access')",
]
addopts = "-m 'not requires_access'"
